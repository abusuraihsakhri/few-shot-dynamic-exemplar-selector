[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "few-shot-dynamic-exemplar-selector"
version = "2.1.0"
description = "Local TF-IDF/MMR few-shot example selection with optional audit and API tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
few-shot-dynamic-exemplar-selector = "exemplar_selector.cli:main"
few-shot-audit = "cli:main"

[project.urls]
Repository = "https://github.com/abusuraihsakhri/few-shot-dynamic-exemplar-selector"

[tool.setuptools]
packages = ["agents", "exemplar_selector"]
py-modules = ["cli", "enrichment", "simulator", "exemplar_selector_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
