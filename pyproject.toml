[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "few-shot-dynamic-exemplar-selector"
version = "2.0.0"
description = "ExemplarSelector: Semantic Distance & Diversity Few-Shot Prompt Builder"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
few-shot-dynamic-exemplar-selector = "exemplar_selector.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/few-shot-dynamic-exemplar-selector"
Repository = "https://github.com/abusuraihsakhri/few-shot-dynamic-exemplar-selector.git"
